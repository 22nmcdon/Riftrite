name: Tests

# Runs the whole test suite (GUT) and the data validator on every pull
# request and every push to main.
on:
  pull_request:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.7.2"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: tools/ci/install_godot.sh
      - name: Import the project
        run: godot --headless --path . --import || true
      - name: Validate game data
        run: godot --headless --path . -s tools/validate_data.gd
      - name: Run the tests
        run: godot --headless -s addons/gut/gut_cmdln.gd -gexit
